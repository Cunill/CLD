name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proves-windows:
    name: Proves (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Instal·lar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Memòria cau d'FFmpeg
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tools/obtenir_ffmpeg.ps1') }}

      - name: Obtenir FFmpeg
        shell: pwsh
        run: ./tools/obtenir_ffmpeg.ps1

      - name: Dependències
        run: uv sync --locked

      - name: Estil
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipus
        run: uv run pyright

      - name: Proves
        run: uv run pytest -m "not perf"

      - name: Artefactes de les proves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artefactes-proves
          path: tests/_artefactes/
          if-no-files-found: ignore
          retention-days: 14
