[project]
name = "passi"
version = "0.0.1"
description = "Passis de fotos amb moviment de càmera, fosa encadenada i música (equivalent al Windows Movie Maker)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6-essentials>=6.8,<6.11",
    "numpy>=2.1,<2.4",
    "opencv-python-headless>=4.10,<4.13",
    "pillow>=11.0,<12",
    "pillow-heif>=0.21,<2",
    "sounddevice>=0.5,<0.6",
]

[project.scripts]
passi = "passi.ui.app:main"
passi-nou = "passi.cli:main_new"
passi-render = "passi.cli:main_render"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
    "hypothesis>=6.115,<7",
    "ruff>=0.8,<0.15",
    "pyright[nodejs]>=1.1.390,<1.2",
]
packaging = [
    "pyinstaller>=6.11,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passi"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not lent and not perf'"
markers = [
    "lent: proves lentes (més de ~5 s); s'executen amb -m 'not perf'",
    "ui: proves de la interfície amb pytest-qt (sense pantalla)",
    "perf: proves de rendiment; només en local al PC de referència o a les fites",
]
qt_api = "pyside6"
filterwarnings = ["error::DeprecationWarning:passi.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
reportMissingModuleSource = false
